name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/gateway-arm64 ./cmd/gateway
      - run: python3 -m py_compile scripts/*.py
      - run: go build -o dist/gateway ./cmd/gateway && python3 scripts/smoke.py
      - run: pip install cfn-lint && cfn-lint infra/aws.yaml
      - run: docker build -t network-telemetry:ci .

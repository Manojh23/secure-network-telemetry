services:
  gateway:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports: ["127.0.0.1:9443:9443"]
    volumes:
      - ./.local:/run/config:ro
      - ./.local/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 15s
